[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "critbench"
version = "0.1.0"
description = "Creative process benchmark for LLMs - testing judgment, not just generation"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Ali Madad", email = "ali@scty.org" }
]
keywords = [
    "llm",
    "benchmark",
    "creativity",
    "evaluation",
    "marketing",
    "brand",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "httpx>=0.27.0",
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "rich>=13.0",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.0",
    "mypy>=1.8",
    "ruff>=0.4",
    "black>=24.0",
]
all = [
    "critbench[dev]",
]

[project.scripts]
critbench = "critbench.cli:app"

[project.urls]
Homepage = "https://critbench.dev"
Repository = "https://github.com/amadad/critbench"
Documentation = "https://github.com/amadad/critbench#readme"

[tool.hatch.build.targets.wheel]
packages = ["benchmark/critbench"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["benchmark/tests"]
addopts = "-v"
